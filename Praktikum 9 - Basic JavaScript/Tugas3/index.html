<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SettingWeb - [2572002]</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Ubah Warna Halaman</h1>

        <div class="pilih-latar">
            <p>Pilih Warna Latar Belakang</p>
            <select name=select1 id="latar">
                <option value="red" id="merah-latar">Merah</option>
                <option value="blue" id="biru-latar">Biru</option>
                <option value="green" id="hijau-latar">Hijau</option>
                <option value="yellow" id="kuning-latar">Kuning</option>
                <option value="white" id="putih-latar">Putih</option>
            </select>
        </div>

        <div class="pilih-tombol">
            <p>Pilih Warna Tombol</p>
            <select name=select1 id="tombol">
                <option value="red" id="merah-tombol">Merah</option>
                <option value="blue" id="biru-tombol">Biru</option>
                <option value="green" id="hijau-tombol">Hijau</option>
                <option value="yellow" id="kuning-tombol">Kuning</option>
                <option value="white" id="putih-tombol">Putih</option>
            </select>
        </div>
 
        <div class="pilih-teks">
            <p>Pilih Warna Teks</p>
            <select name=select1 id="warna-teks">
                <option value="red" id="merah-teks">Merah</option>
                <option value="blue" id="biru-teks">Biru</option>
                <option value="green" id="hijau-teks">Hijau</option>
                <option value="yellow" id="kuning-teks">Kuning</option>
                <option value="white" id="putih-teks">Putih</option>
            </select>
        </div>

        <div class="ubah">
            <button onclick="ubah()" id="ubah">Ganti Warna</button>
        </div>

        <div id="teks">

        </div>

    </div>
    
</body>
</html>
